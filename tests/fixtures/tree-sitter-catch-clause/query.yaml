# Regression fixture for the detached predicate that aborted the production
# replay on Binaryen's deeply nested .wast input parsed as JavaScript.
# Group the predicate with its node pattern so it cannot become a separate
# zero-step query pattern.
if:
  type: tree-sitter
  language: javascript
  query: |
    ((catch_clause
      parameter: (identifier) @err_param
      body: (statement_block
        (expression_statement
          (assignment_expression
            right: (call_expression
              function: (member_expression
                object: (member_expression
                  object: (identifier) @err_use)))))))
      (#eq? @err_param @err_use))
