[package]
name = "postdoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Worker and server coordination for the Atomdrift analysis fleet"
repository = "https://github.com/atomdrift-project/postdoc"

[dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` lets a judge carry its engine's output pre-serialized, so a
# report embeds it without a parse or a re-encode. At worker scale the cleave
# report is the largest thing postdoc touches and it is pure pass-through.
serde_json = { version = "1", features = ["raw_value"] }

# The engines. Declared from git like every other dependency in the fleet; the
# resolved commits stay pinned in Cargo.lock and `cargo update` advances them.
# See the [patch] block below for developing against sibling checkouts.
#
# `default-features = false` drops cleave's jemalloc default, matching ../scan
# and ../isomer: postdoc's binary owns its own allocator choice, and a library
# has no business picking one for it.
cleave = { git = "https://github.com/atomdrift-project/cleave.git", default-features = false }
# Lib name `scan`, package name `atomdrift-scan` — the same split ../isomer
# relies on. Supplies the model, the trait floor, and the interpreter.
atomdrift-scan = { git = "https://github.com/atomdrift-project/scan.git" }
# The differential judge.
isomer = { git = "https://github.com/atomdrift-project/isomer.git" }

# The binary's own needs: argument parsing, the async runtime the worker loop
# runs on, and the subscriber that gives the analysis stack's `tracing` output
# somewhere to go. postdoc emits no log records of its own — the engines do,
# and a binary only has to install the sink — so the `tracing` facade itself is
# not a dependency here.
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows has no jemalloc here; mimalloc plays the same role. The CRT heap was
# 12% exclusive on a two-Go profile and rayon workers convoy on it, which is
# the same failure jemalloc is chosen to avoid elsewhere. Keep in lockstep with
# `mod mimalloc_alloc` in src/main.rs.
[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
# `extended` exposes `mi_collect`. mimalloc has no background purge thread, so
# an idle worker never returns retained segments on its own — and its RSS gates
# its own intake.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
tree-sitter = "0.28"

# Keep this list in lockstep with `mod jemalloc` in src/main.rs. The tuning
# string itself is `cleave::JEMALLOC_CONF`, shared with ../scan so every binary
# running cleave's analysis gets the same allocator behaviour.
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = "0.7"
# Already beneath tikv-jemallocator; named directly for its
# malloc/calloc/realloc/free declarations, which carry the right C signatures
# and the `_rjem_` link_name prefix its build script decides on.
tikv-jemalloc-sys = "0.7"
# Direct handle on tree-sitter (already in the graph via cleave) purely to call
# `set_allocator` at startup: its C core otherwise allocates through the system
# malloc, invisible to every jemalloc budget and decay policy the fleet is
# tuned around. Version stays in lockstep with cleave's; `links =
# "tree-sitter-language"` makes divergence a loud resolve error.
tree-sitter = "0.28"

# Mirrors the patch sections in ../cleave, ../scan and ../isomer. A [patch]
# applies only from the root manifest, so every crate that can be a root has
# to carry its own copy — postdoc is a root, so this is not optional and not
# duplication that can be factored out. tree-sitter 0.28 is unpublished
# (crates.io tops out at 0.27.x) and cleave requires it, so this is
# load-bearing for resolution, not only for a fix. It must name the same fork
# the siblings do — tstromberg/tree-sitter, which carries the illumos endian.h
# fix — because the root manifest's patch is the one that applies, so pointing
# it at upstream silently downgrades the whole graph. Both crates must come
# from one source: tree-sitter uses its in-tree tree-sitter-language, and
# `links = "tree-sitter-language"` permits exactly one copy in the graph.
# Keep in lockstep with the siblings; remove when a release lands.
[patch.crates-io]
tree-sitter = { git = "https://github.com/tstromberg/tree-sitter", branch = "master" }
tree-sitter-language = { git = "https://github.com/tstromberg/tree-sitter", branch = "master" }

# DEVELOPMENT OVERRIDE — must be commented out before committing.
#
# postdoc lands alongside changes in scan and isomer that are not pushed yet,
# so until they are, it builds against the checkouts beside it. `scripts/
# pre-commit` refuses a commit while these lines are active, which is the
# point: a committed path override builds against crates that exist on no
# other machine. When the sibling changes land, comment this out and
# `cargo update -p atomdrift-scan -p isomer -p cleave`.
#
# Patching by source URL rather than adding path dependencies keeps one copy
# of each crate in the graph. isomer reaches scan and cleave through the same
# URLs, so without this its `scan::Classification` and postdoc's would be two
# unrelated types that happen to share a name.



[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 16

# Optimized but un-LTO'd: `make quick` builds then immediately runs the binary,
# and fat LTO's link time dominates that loop. Mirrors ../scan and ../isomer.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

# Dependencies at opt-level 1 in dev builds. postdoc's own analysis work is all
# in cleave and the model, reached through scan, so an unoptimized dependency
# tree makes a debug run look far slower than it is. Matches ../scan.
[profile.dev.package."*"]
opt-level = 1

# Mirrors ../scan's [workspace.lints], plus `unsafe_code = "deny"` — postdoc
# coordinates other crates' analyses and has no reason to write any unsafe at
# all, so it forbids the block outright rather than only policing
# unsafe_op_in_unsafe_fn. Keep in sync with ../scan and ../isomer; a lint that
# fires there should fire here.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
